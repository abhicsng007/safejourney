<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e37400"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="50" font-size="34" font-weight="700" fill="#202124">SafeJourney — Agentic Architecture</text>
  <text x="40" y="80" font-size="17" fill="#5f6368">Multi-agent travel-safety guardian · Google ADK + Gemini 3.7 Flash (Vertex AI, global) · Cloud Run</text>

  <!-- Legend -->
  <g font-size="13" fill="#5f6368">
    <rect x="1170" y="34" width="390" height="52" rx="10" fill="#f8f9fa" stroke="#dadce0"/>
    <line x1="1188" y1="52" x2="1218" y2="52" stroke="#1a73e8" stroke-width="3" marker-end="url(#aBlue)"/>
    <text x="1224" y="56">request</text>
    <line x1="1300" y1="52" x2="1330" y2="52" stroke="#e37400" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#aAmber)"/>
    <text x="1336" y="56">autonomous loop</text>
    <line x1="1188" y1="72" x2="1218" y2="72" stroke="#5f6368" stroke-width="3" marker-end="url(#aGrey)"/>
    <text x="1224" y="76">data / state</text>
  </g>

  <!-- ================= AUTONOMOUS-LOOP top push arrow (worker -> client) ================= -->
  <path d="M1200,130 L1200,104 L200,104 L200,150" fill="none" stroke="#e37400" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#aAmber)"/>
  <rect x="560" y="92" width="360" height="24" rx="12" fill="#fff3e0" stroke="#f4b400"/>
  <text x="740" y="109" font-size="13.5" font-weight="600" fill="#b06000" text-anchor="middle">FCM push · alert even with the app closed</text>

  <!-- ================= CLIENT ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="310" height="212" rx="14" fill="#ffffff" stroke="#dadce0"/>
  </g>
  <rect x="40" y="150" width="6" height="212" rx="3" fill="#4285F4"/>
  <text x="66" y="182" font-size="19" font-weight="700" fill="#1a73e8">React PWA</text>
  <text x="66" y="201" font-size="12.5" fill="#5f6368">Cloud Run · web · PWA + service worker</text>
  <g font-size="13.5" fill="#3c4043">
    <text x="66" y="228">• MapLibre + MapTiler live map</text>
    <text x="66" y="251">• Plan &amp; safety-ranked routes</text>
    <text x="66" y="274">• Reasoning timeline · conditions card</text>
    <text x="66" y="297">• Weather-reactive theme · voice</text>
    <text x="66" y="320">• Guardian chat · SOS</text>
    <text x="66" y="343">• FCM background push (SW)</text>
  </g>

  <!-- ================= AGENT-API ================= -->
  <g filter="url(#shadow)">
    <rect x="390" y="120" width="440" height="290" rx="14" fill="#ffffff" stroke="#dadce0"/>
  </g>
  <rect x="390" y="120" width="6" height="290" rx="3" fill="#0F9D58"/>
  <text x="416" y="152" font-size="19" font-weight="700" fill="#0b8043">agent-api</text>
  <text x="416" y="171" font-size="12.5" fill="#5f6368">Cloud Run · FastAPI + Google ADK</text>

  <rect x="414" y="186" width="392" height="96" rx="10" fill="#e6f4ea" stroke="#0F9D58"/>
  <text x="430" y="208" font-size="14.5" font-weight="700" fill="#0b8043">ADK agent fleet · Gemini 3.7 Flash</text>
  <text x="430" y="230" font-size="13" fill="#3c4043">Guardian Core (orchestrator) delegates to →</text>
  <text x="430" y="251" font-size="13" fill="#3c4043">Prep · Route Guardian · Safe Harbor ·</text>
  <text x="430" y="270" font-size="13" fill="#3c4043">Mobility · SOS  (agent-to-agent hand-off)</text>

  <rect x="414" y="294" width="392" height="100" rx="10" fill="#f1f3f4" stroke="#dadce0"/>
  <text x="430" y="316" font-size="14.5" font-weight="700" fill="#3c4043">Grounded tools</text>
  <text x="430" y="337" font-size="12.5" fill="#3c4043">plan_safe_routes · scan_route_hazards ·</text>
  <text x="430" y="356" font-size="12.5" fill="#3c4043">find_nearby · get_safe_harbors · mobility ·</text>
  <text x="430" y="375" font-size="12.5" fill="#3c4043">check_trip_now · web-advisories · hazard_scan</text>

  <!-- ================= MONITOR-WORKER ================= -->
  <g filter="url(#shadow)">
    <rect x="1180" y="130" width="360" height="150" rx="14" fill="#ffffff" stroke="#dadce0"/>
  </g>
  <rect x="1180" y="130" width="6" height="150" rx="3" fill="#F4B400"/>
  <text x="1206" y="162" font-size="19" font-weight="700" fill="#b06000">monitor-worker</text>
  <text x="1206" y="181" font-size="12.5" fill="#5f6368">Cloud Run · autonomous per-trip loop</text>
  <g font-size="13.5" fill="#3c4043">
    <text x="1206" y="208">• Hazard Sentinel + Decision Agent</text>
    <text x="1206" y="231">• evaluate_trip() — scan road ahead</text>
    <text x="1206" y="254">• change-detect + adaptive interval</text>
  </g>

  <!-- ================= PUB/SUB + SCHEDULER ================= -->
  <g filter="url(#shadow)"><rect x="1320" y="315" width="240" height="56" rx="12" fill="#ffffff" stroke="#dadce0"/></g>
  <rect x="1320" y="315" width="6" height="56" rx="3" fill="#7E57C2"/>
  <text x="1344" y="340" font-size="15" font-weight="700" fill="#5e35b1">Pub/Sub</text>
  <text x="1344" y="358" font-size="12" fill="#5f6368">trip-evaluate · fan-out</text>

  <g filter="url(#shadow)"><rect x="1320" y="405" width="240" height="56" rx="12" fill="#ffffff" stroke="#dadce0"/></g>
  <rect x="1320" y="405" width="6" height="56" rx="3" fill="#7E57C2"/>
  <text x="1344" y="430" font-size="15" font-weight="700" fill="#5e35b1">Cloud Scheduler</text>
  <text x="1344" y="448" font-size="12" fill="#5f6368">heartbeat (~2 min)</text>

  <!-- ================= FIRESTORE ================= -->
  <g filter="url(#shadow)"><rect x="890" y="430" width="300" height="82" rx="14" fill="#ffffff" stroke="#dadce0"/></g>
  <rect x="890" y="430" width="6" height="82" rx="3" fill="#7E57C2"/>
  <text x="916" y="462" font-size="18" font-weight="700" fill="#5e35b1">Firestore</text>
  <text x="916" y="484" font-size="12.5" fill="#3c4043">trips · snapshots · alerts ·</text>
  <text x="916" y="502" font-size="12.5" fill="#3c4043">incidents · hazardCache</text>

  <!-- ================= ARROWS ================= -->
  <!-- client <-> agent-api (request) -->
  <line x1="350" y1="246" x2="388" y2="246" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <line x1="388" y1="270" x2="352" y2="270" stroke="#1a73e8" stroke-width="2.6" marker-end="url(#aBlue)"/>
  <text x="369" y="238" font-size="12" fill="#1a73e8" text-anchor="middle">REST</text>

  <!-- agent-api -> firestore -->
  <path d="M830,360 L890,452" fill="none" stroke="#5f6368" stroke-width="2.4" marker-end="url(#aGrey)"/>
  <text x="856" y="398" font-size="12" fill="#5f6368">read/write</text>
  <!-- worker -> firestore -->
  <path d="M1200,280 L1170,430" fill="none" stroke="#5f6368" stroke-width="2.4" marker-end="url(#aGrey)"/>
  <text x="1150" y="360" font-size="12" fill="#5f6368" text-anchor="end">snapshot · alert</text>

  <!-- autonomous loop (amber) -->
  <!-- scheduler -> agent-api /dispatch -->
  <path d="M1320,432 L840,432 L822,400" fill="none" stroke="#e37400" stroke-width="2.6" marker-end="url(#aAmber)"/>
  <text x="1120" y="425" font-size="12.5" font-weight="600" fill="#b06000" text-anchor="middle">heartbeat → /monitor/dispatch (query due trips)</text>
  <!-- agent-api -> pub/sub -->
  <path d="M830,336 L1318,340" fill="none" stroke="#e37400" stroke-width="2.6" marker-end="url(#aAmber)"/>
  <text x="1074" y="330" font-size="12.5" font-weight="600" fill="#b06000" text-anchor="middle">publish {trip_id}</text>
  <!-- pub/sub -> worker -->
  <path d="M1440,315 L1440,282" fill="none" stroke="#e37400" stroke-width="2.6" marker-end="url(#aAmber)"/>
  <text x="1452" y="303" font-size="12" font-weight="600" fill="#b06000">push</text>

  <!-- agent-api -> google AI strip -->
  <path d="M560,410 L560,543" fill="none" stroke="#0F9D58" stroke-width="2.6" marker-end="url(#aGrey)"/>
  <text x="572" y="470" font-size="12.5" fill="#0b8043">reason · ground · narrate · route</text>
  <!-- worker -> google AI strip -->
  <path d="M1250,280 L1250,543" fill="none" stroke="#0F9D58" stroke-width="2.6" marker-end="url(#aGrey)"/>
  <text x="1262" y="470" font-size="12.5" fill="#0b8043">decide (Gemini)</text>

  <!-- ================= GOOGLE AI &amp; CLOUD STRIP ================= -->
  <rect x="40" y="545" width="1520" height="182" rx="16" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="64" y="576" font-size="16" font-weight="700" fill="#202124">Google AI &amp; Cloud</text>
  <text x="210" y="576" font-size="12.5" fill="#5f6368">— the models &amp; APIs the agents and tools call</text>

  <!-- row of chips -->
  <g>
    <!-- chip 1 FCM -->
    <rect x="71" y="600" width="228" height="60" rx="12" fill="#fff8e1" stroke="#F4B400"/>
    <text x="185" y="626" font-size="14" font-weight="700" fill="#b06000" text-anchor="middle">Firebase Cloud</text>
    <text x="185" y="646" font-size="14" font-weight="700" fill="#b06000" text-anchor="middle">Messaging (push)</text>
    <!-- chip 2 Gemini -->
    <rect x="317" y="600" width="228" height="60" rx="12" fill="#fce8e6" stroke="#DB4437"/>
    <text x="431" y="626" font-size="14" font-weight="700" fill="#c5221f" text-anchor="middle">Gemini 3.7 Flash</text>
    <text x="431" y="646" font-size="13" fill="#c5221f" text-anchor="middle">Vertex AI · global</text>
    <!-- chip 3 Search grounding -->
    <rect x="563" y="600" width="228" height="60" rx="12" fill="#e8f0fe" stroke="#4285F4"/>
    <text x="677" y="626" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="middle">Grounding with</text>
    <text x="677" y="646" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="middle">Google Search</text>
    <!-- chip 4 Gemma -->
    <rect x="809" y="600" width="228" height="60" rx="12" fill="#e6f4ea" stroke="#0F9D58"/>
    <text x="923" y="626" font-size="14" font-weight="700" fill="#0b8043" text-anchor="middle">Gemma</text>
    <text x="923" y="646" font-size="12.5" fill="#0b8043" text-anchor="middle">crowd-report triage</text>
    <!-- chip 5 TTS -->
    <rect x="1055" y="600" width="228" height="60" rx="12" fill="#fff8e1" stroke="#F4B400"/>
    <text x="1169" y="626" font-size="14" font-weight="700" fill="#b06000" text-anchor="middle">Cloud Text-to-</text>
    <text x="1169" y="646" font-size="14" font-weight="700" fill="#b06000" text-anchor="middle">Speech (Neural2)</text>
    <!-- chip 6 Maps -->
    <rect x="1301" y="600" width="228" height="60" rx="12" fill="#fce8e6" stroke="#DB4437"/>
    <text x="1415" y="626" font-size="14" font-weight="700" fill="#c5221f" text-anchor="middle">Maps Platform</text>
    <text x="1415" y="646" font-size="11.5" fill="#c5221f" text-anchor="middle">Directions·Places·Geocode</text>
  </g>
  <!-- infra footnote row -->
  <text x="71" y="700" font-size="12.5" fill="#5f6368">Runtime &amp; infra: <tspan font-weight="600" fill="#3c4043">Cloud Run</tspan> (3 services) · <tspan font-weight="600" fill="#3c4043">Firestore</tspan> · <tspan font-weight="600" fill="#3c4043">Cloud Scheduler</tspan> · <tspan font-weight="600" fill="#3c4043">Pub/Sub</tspan> · <tspan font-weight="600" fill="#3c4043">Cloud Build + Artifact Registry</tspan> · <tspan font-weight="600" fill="#3c4043">Cloud Logging</tspan></text>

  <!-- strip -> sources arrows -->
  <path d="M430,727 L430,753" fill="none" stroke="#5f6368" stroke-width="2.2" marker-end="url(#aGrey)"/>
  <path d="M1100,727 L1100,753" fill="none" stroke="#5f6368" stroke-width="2.2" marker-end="url(#aGrey)"/>
  <text x="765" y="746" font-size="12" fill="#5f6368" text-anchor="middle">fetch · ground</text>

  <!-- ================= GROUNDED SOURCES STRIP ================= -->
  <rect x="40" y="755" width="1520" height="150" rx="16" fill="#ffffff" stroke="#dadce0"/>
  <text x="64" y="785" font-size="16" font-weight="700" fill="#202124">Grounded data sources</text>
  <text x="248" y="785" font-size="12.5" fill="#5f6368">— real, keyless feeds (graceful fallbacks); the agents never invent a hazard</text>

  <g font-size="13" fill="#3c4043">
    <rect x="71" y="805" width="228" height="76" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="185" y="835" font-weight="700" text-anchor="middle" fill="#202124">Open-Meteo</text>
    <text x="185" y="856" text-anchor="middle" font-size="12">weather · AQI ·</text>
    <text x="185" y="872" text-anchor="middle" font-size="12">visibility</text>

    <rect x="317" y="805" width="228" height="76" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="431" y="835" font-weight="700" text-anchor="middle" fill="#202124">OSM Overpass</text>
    <text x="431" y="856" text-anchor="middle" font-size="12">roadwork · road</text>
    <text x="431" y="872" text-anchor="middle" font-size="12">condition · rail</text>

    <rect x="563" y="805" width="228" height="76" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="677" y="835" font-weight="700" text-anchor="middle" fill="#202124">GDACS</text>
    <text x="677" y="858" text-anchor="middle" font-size="12">floods · cyclones ·</text>
    <text x="677" y="874" text-anchor="middle" font-size="12">quakes</text>

    <rect x="809" y="805" width="228" height="76" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="923" y="835" font-weight="700" text-anchor="middle" fill="#202124">GLOF / landslide</text>
    <text x="923" y="858" text-anchor="middle" font-size="12">curated cascade</text>
    <text x="923" y="874" text-anchor="middle" font-size="12">basins</text>

    <rect x="1055" y="805" width="228" height="76" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="1169" y="835" font-weight="700" text-anchor="middle" fill="#202124">Blackspot DB</text>
    <text x="1169" y="858" text-anchor="middle" font-size="12">accident-prone</text>
    <text x="1169" y="874" text-anchor="middle" font-size="12">clusters</text>

    <rect x="1301" y="805" width="228" height="76" rx="12" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="1415" y="835" font-weight="700" text-anchor="middle" fill="#202124">Crowd reports</text>
    <text x="1415" y="858" text-anchor="middle" font-size="12">text / voice →</text>
    <text x="1415" y="874" text-anchor="middle" font-size="12">Gemma triage</text>
  </g>

  <!-- footer -->
  <text x="1560" y="936" font-size="12" fill="#9aa0a6" text-anchor="end">Autonomous loop: scan road ahead → change-detect → decide (Gemini, rule-validated) → alert · reroute · shelter → FCM push</text>
</svg>
