[project]
name = "safejourney"
version = "0.1.0"
description = "SafeJourney agent-api: ADK agents, tools, and the autonomous monitoring engine."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "httpx>=0.27",
    "safejourney-shared",
]

[project.optional-dependencies]
google = [
    "google-adk>=0.3.0",
    "google-genai>=0.3.0",
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
    "firebase-admin>=6.5",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["safejourney*"]
