[project]
name = "safejourney-shared"
version = "0.1.0"
description = "Shared domain logic for SafeJourney (hazards, geo, safety scoring, models)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["safejourney_shared*"]
